<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joseph's Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Joseph's Contact</h1>
            <p>Benvenuto nel mio sito di contatti</p>
        </header>

        <main>
            <section class="contact-form">
                <h2>Contattami</h2>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Nome:</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Messaggio:</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>

                    <button type="submit" class="btn">Invia Messaggio</button>
                </form>
                <div id="responseMessage" class="response-message"></div>
            </section>

            <section class="contact-info">
                <h2>Informazioni di Contatto</h2>
                <ul>
                    <li><strong>Email:</strong> joseph@example.com</li>
                    <li><strong>Telefono:</strong> +39 XXX XXXXXXX</li>
                    <li><strong>Ubicazione:</strong> Italia</li>
                </ul>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Joseph's Contact. Tutti i diritti riservati.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
